# Pushing a tag such as v0.1.0 builds a signed, notarized macOS disk image
# and a Windows amd64 ZIP, then publishes both as one GitHub release.
# The tag must match the version in mygo.json.
#
# Running this workflow by hand builds both platforms (macOS with an ad hoc
# signature) and uploads workflow artifacts without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # Compiling the Icon Composer app icon needs Xcode 26 or later.
    runs-on: macos-26
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag and the signing secrets
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ github.ref_name }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in mygo.json"
            exit 1
          fi
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Fetch the mihomo core and geo data
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: darwin
          GOARCH: arm64
          MIHOMO_SOURCE_DIR: dist
        run: ./scripts/fetch-core.sh

      - name: Import the Developer ID certificate
        if: env.PUBLISH == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"

      - name: Build, sign and notarize
        if: env.PUBLISH == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          ./scripts/release.sh
          rm "$NOTARY_KEY"

      - name: Build without publishing
        if: env.PUBLISH != 'true'
        run: go tool mygo build -platform darwin/arm64 -skip-notarize -sign - .

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            build/darwin-arm64/bowel-*-arm64.dmg
            dist/mihomo-*-source.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match version $version in mygo.json"
          }

      - name: Fetch the Windows mihomo core and geo data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: windows
          GOARCH: amd64
        run: ./scripts/fetch-core.sh

      - name: Build Windows amd64
        run: go tool mygo build -platform windows/amd64 -skip-installer .

      - name: Check the bundled core and package the app
        shell: pwsh
        run: |
          $core = 'build/windows-amd64/bin/mihomo.exe'
          if (!(Test-Path $core)) {
            throw "Windows mihomo binary missing: $core"
          }
          & $core -v
          if ($LASTEXITCODE -ne 0) {
            throw 'The bundled mihomo core could not run on Windows'
          }
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows-amd64/* -DestinationPath "dist/bowel-$version-windows-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/bowel-*-windows-amd64.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.dmg dist/*.zip dist/mihomo-*-source.tar.gz --verify-tag --generate-notes --title "bowel $TAG"
